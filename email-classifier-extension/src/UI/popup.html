<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Classifier</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h2>Email Classifier</h2>
  <textarea id="email-input" placeholder="Paste email text here..." rows="5" cols="40"></textarea>
  <br>
  <button id="classify-btn">Classify</button>
  <div id="results">
    <h3>Results:</h3>
    <p id="category">Category: </p>
    <p id="cad-urls">CAD URLs: </p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
